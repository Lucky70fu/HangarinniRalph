{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-title">
                    {% if object %}
                        Update Organization Member
                    {% else %}
                        Add New Organization Member
                    {% endif %}
                </div>

                <div class="card-body">
                    <form class="" action="" method="post" novalidate>
                        {% csrf_token %}
                        {% include 'includes/form.html' %}

                        <button type="submit" class="btn btn-primary">
                            Save
                        </button>
                        <a href="{% url 'orgmember-list' %}" class="btn btn-secondary">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
